<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VoiceTask</title>
<style>
  :root {
    --signal-dim: #f2a93b33;
  }

  :root[data-theme="dark"] {
    --ink: #12161d;
    --panel: #1a2029;
    --panel-line: #2a3140;
    --panel-line-strong: #384056;
    --paper: #edeef0;
    --paper-dim: #9aa3b2;
    --signal: #f2a93b;
    --teal: #4fa8a0;
    --high: #e8623d;
    --medium: #f2a93b;
    --low: #4fa8a0;
    --done: #4a5262;
    --row-alt: #171c24;
    --bubble-user: #2a3140;
    --bubble-assistant: #1a2029;
  }

  :root[data-theme="light"] {
    --ink: #f6f4ee;
    --panel: #ffffff;
    --panel-line: #e5e1d5;
    --panel-line-strong: #d3cebd;
    --paper: #1c2029;
    --paper-dim: #6b7280;
    --signal: #c67c17;
    --teal: #297d75;
    --high: #c2481f;
    --medium: #c67c17;
    --low: #297d75;
    --done: #9aa0ab;
    --row-alt: #fbfaf6;
    --bubble-user: #ece7d9;
    --bubble-assistant: #ffffff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100dvh;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 24px) 20px calc(env(safe-area-inset-bottom, 24px) + 40px);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 8px;
    gap: 12px;
  }

  .header-text { text-align: center; flex: 1; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin: 0 0 6px;
  }

  h1 {
    font-size: 22px;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--paper-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }

  .header-spacer { width: 38px; flex-shrink: 0; }

  /* --- mic --- */
  .mic-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 16px;
    position: relative;
  }

  .mic-ring {
    position: relative;
    width: 116px;
    height: 116px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    transition: all 0.25s ease;
    pointer-events: none;
  }

  .mic-btn {
    position: relative;
    z-index: 1;
  }

  .mic-ring.listening::before {
    border-color: var(--signal);
    animation: pulse 1.4s ease-out infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.92); opacity: 0.9; box-shadow: 0 0 0 0 var(--signal-dim); }
    70% { transform: scale(1.18); opacity: 0; box-shadow: 0 0 0 14px transparent; }
    100% { transform: scale(0.92); opacity: 0; }
  }

  .mic-btn {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: none;
    background: var(--panel);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    box-shadow: inset 0 0 0 1px var(--panel-line);
  }

  .mic-btn:active { transform: scale(0.96); }

  .mic-btn.listening {
    background: var(--signal);
    color: var(--ink);
  }

  .mic-btn svg { width: 30px; height: 30px; }

  .status-line {
    margin-top: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    color: var(--paper-dim);
    text-align: center;
    min-height: 20px;
    line-height: 1.5;
    padding: 0 12px;
  }

  .status-line.active { color: var(--signal); }

  /* --- chat thread --- */
  .chat-section { margin-bottom: 18px; }

  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .chat-header h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--paper-dim);
    font-weight: 600;
    margin: 0;
  }

  .clear-chat-btn {
    background: none;
    border: none;
    color: var(--paper-dim);
    font-size: 11.5px;
    font-family: ui-monospace, monospace;
    cursor: pointer;
    text-decoration: underline;
    padding: 2px;
  }

  .chat-thread {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px;
  }

  .bubble {
    max-width: 84%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    border: 1px solid var(--panel-line);
    border-bottom-left-radius: 4px;
  }

  .chat-empty {
    color: var(--paper-dim);
    font-size: 12.5px;
    text-align: center;
    padding: 10px;
  }

  .option-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-self: flex-start;
    max-width: 84%;
  }
  .option-chip {
    background: var(--panel);
    border: 1px solid var(--signal);
    color: var(--signal);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .option-chip:active { background: var(--signal-dim); }

  /* --- type-to-command fallback --- */
  .type-row {
    display: flex;
    gap: 8px;
    margin: 4px 0 20px;
  }

  .type-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--paper);
    font-size: 15px;
  }

  .type-row input::placeholder { color: var(--paper-dim); }

  .type-row button {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--paper);
    border-radius: 10px;
    padding: 0 16px;
    font-size: 14px;
    cursor: pointer;
  }

  /* --- view tabs --- */
  .view-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .view-tab {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--paper-dim);
    border-radius: 9px;
    padding: 8px 6px;
    font-size: 12.5px;
    cursor: pointer;
    text-align: center;
  }
  .view-tab.active {
    border-color: var(--signal);
    color: var(--signal);
  }

  /* --- groups (categories) --- */
  .group-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .group-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--paper-dim);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .group-chip.active {
    border-color: var(--teal);
    color: var(--teal);
  }
  .group-chip .x-btn {
    border: none;
    background: none;
    color: inherit;
    opacity: 0.6;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 0 0 0 2px;
  }
  .group-chip .x-btn:hover { opacity: 1; }
  .group-chip.add-chip {
    border-style: dashed;
  }

  .row-category-select {
    background: transparent;
    border: none;
    color: var(--teal);
    font-family: ui-monospace, monospace;
    font-size: 10px;
    max-width: 70px;
    padding: 0;
    flex-shrink: 0;
  }
  .row-category-select:invalid { color: var(--panel-line-strong); }

  /* --- controls: filter / sort --- */
  .controls-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .controls-row select {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--paper);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
  }

  /* --- task tables --- */
  .section-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 0 8px;
    cursor: pointer;
    user-select: none;
  }

  .section-label h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--paper-dim);
    font-weight: 600;
    margin: 0;
  }

  .section-label .count {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--paper-dim);
  }

  .section-label .right { display: flex; align-items: center; gap: 6px; }
  .section-label .chevron { transition: transform 0.15s ease; color: var(--paper-dim); }
  .section-label.collapsed .chevron { transform: rotate(-90deg); }

  .task-table {
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .task-table.collapsed { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 78px 68px 96px;
    align-items: center;
    gap: 6px;
    padding: 10px 10px;
    border-bottom: 1px solid var(--panel-line);
  }
  .row:last-child { border-bottom: none; }

  .row.head {
    background: var(--row-alt);
    font-family: ui-monospace, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--paper-dim);
    padding: 8px 10px;
  }

  .row.data:nth-child(even) { background: var(--row-alt); }

  .row-title-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .priority-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .priority-dot.high { background: var(--high); }
  .priority-dot.medium { background: var(--medium); }
  .priority-dot.low { background: var(--low); }

  .row-title {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row.done .row-title { text-decoration: line-through; color: var(--paper-dim); }

  .row-recurrence {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: var(--paper-dim);
    flex-shrink: 0;
  }

  .row-priority-label {
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--paper-dim);
  }

  .due-badge {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.02em;
  }
  .due-badge.overdue { color: var(--high); }
  .due-badge.today { color: var(--signal); }
  .due-badge.upcoming { color: var(--teal); }
  .due-badge.none { color: var(--panel-line-strong); }

  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }

  .icon-btn {
    width: 25px;
    height: 25px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--paper-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--panel-line); }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn.star-on { color: var(--signal); }
  .icon-btn.myday-on { color: var(--teal); }

  .empty-state {
    text-align: center;
    color: var(--paper-dim);
    font-size: 13.5px;
    padding: 24px 20px;
  }

  /* --- excel bar --- */
  .excel-bar {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .ghost-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--paper-dim);
    border-radius: 10px;
    padding: 11px;
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }

  #import-input { display: none; }

  @media (max-width: 420px) {
    .row { grid-template-columns: 1fr 58px 90px; }
    .row-priority-label { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-spacer"></div>
    <div class="header-text">
      <p class="eyebrow">VoiceTask</p>
      <h1>Say it, it's on the list.</h1>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>
      </svg>
    </button>
  </header>

  <div class="mic-stage">
    <div class="mic-ring" id="mic-ring">
      <button class="mic-btn" id="mic-btn" aria-label="Start voice command">
        <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>
    </div>
    <p class="status-line" id="status-line">Tap the mic, ask or say a command</p>
  </div>

  <div class="type-row">
    <input type="text" id="type-input" placeholder="ask or type a command…" />
    <button id="type-send">Send</button>
  </div>

  <div class="chat-section">
    <div class="chat-header">
      <h2>Conversation</h2>
      <button class="clear-chat-btn" id="clear-chat-btn">clear</button>
    </div>
    <div class="chat-thread" id="chat-thread">
      <div class="chat-empty" id="chat-empty">Ask something like "what are my top 3 upcoming tasks?"</div>
    </div>
  </div>

  <div class="view-tabs">
    <button class="view-tab active" data-view="all">All</button>
    <button class="view-tab" data-view="myday">☀ My Day</button>
    <button class="view-tab" data-view="favorites">★ Favorites</button>
  </div>

  <div class="group-bar" id="group-bar"></div>

  <div class="controls-row">
    <select id="priority-filter">
      <option value="all">All priorities</option>
      <option value="high">High only</option>
      <option value="medium">Medium only</option>
      <option value="low">Low only</option>
    </select>
    <select id="sort-select">
      <option value="smart">Sort: Smart</option>
      <option value="due">Sort: Due date</option>
      <option value="priority">Sort: Priority</option>
      <option value="alpha">Sort: A–Z</option>
      <option value="newest">Sort: Newest first</option>
    </select>
  </div>

  <div id="active-groups"></div>

  <div class="section-label" id="completed-toggle">
    <h2>Completed</h2>
    <span class="right">
      <span class="count" id="completed-count">0</span>
      <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </span>
  </div>
  <div class="task-table collapsed" id="completed-table"></div>

  <div class="excel-bar">
    <button class="ghost-btn" id="export-btn">Export to Excel</button>
    <button class="ghost-btn" id="import-btn">Import from Excel</button>
    <input type="file" id="import-input" accept=".xlsx" />
  </div>
</div>

<script>
const API = ""; // same-origin; set to your backend URL if hosted separately

const micBtn = document.getElementById("mic-btn");
const micRing = document.getElementById("mic-ring");
const statusLine = document.getElementById("status-line");
const activeGroups = document.getElementById("active-groups");
const completedTable = document.getElementById("completed-table");
const completedCount = document.getElementById("completed-count");
const completedToggle = document.getElementById("completed-toggle");
const typeInput = document.getElementById("type-input");
const typeSend = document.getElementById("type-send");
const exportBtn = document.getElementById("export-btn");
const importBtn = document.getElementById("import-btn");
const importInput = document.getElementById("import-input");
const themeToggle = document.getElementById("theme-toggle");
const priorityFilter = document.getElementById("priority-filter");
const sortSelect = document.getElementById("sort-select");
const chatThread = document.getElementById("chat-thread");
const chatEmpty = document.getElementById("chat-empty");
const clearChatBtn = document.getElementById("clear-chat-btn");
const viewTabs = document.querySelectorAll(".view-tab");

let allTasks = [];
let currentView = "all";
let allCategories = [];
let activeGroupFilter = null; // null = all groups

/* ---- theme ---- */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("voicetask-theme", theme);
}
(function initTheme() {
  const saved = localStorage.getItem("voicetask-theme");
  if (saved) { applyTheme(saved); return; }
  const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(prefersLight ? "light" : "dark");
})();
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
});

/* ---- view tabs ---- */
viewTabs.forEach(tab => {
  tab.addEventListener("click", () => {
    viewTabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentView = tab.dataset.view;
    renderTables();
  });
});

/* ---- collapsible group state (persisted) ---- */
function getCollapseState() {
  try { return JSON.parse(localStorage.getItem("voicetask-group-collapse") || "{}"); }
  catch (e) { return {}; }
}
function setGroupCollapsed(key, collapsed) {
  const state = getCollapseState();
  state[key] = collapsed;
  localStorage.setItem("voicetask-group-collapse", JSON.stringify(state));
}

/* ---- completed section collapse ---- */
let completedCollapsed = true;
completedToggle.addEventListener("click", () => {
  completedCollapsed = !completedCollapsed;
  completedToggle.classList.toggle("collapsed", completedCollapsed);
  completedTable.classList.toggle("collapsed", completedCollapsed);
});

function setStatus(text, active = false) {
  statusLine.textContent = text;
  statusLine.classList.toggle("active", active);
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.02;
  window.speechSynthesis.speak(utter);
}

function iconTrash() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>`;
}
function iconCheck() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg>`;
}
function iconStar(filled) {
  return `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6L12 3Z"/></svg>`;
}
function iconSun() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
}

function dueInfo(dueDate) {
  if (!dueDate) return { cls: "none", label: "—", days: null };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dueDate + "T00:00:00");
  const diffDays = Math.round((d - today) / 86400000);

  if (diffDays < 0) return { cls: "overdue", label: "overdue", days: diffDays };
  if (diffDays === 0) return { cls: "today", label: "today", days: diffDays };
  if (diffDays === 1) return { cls: "upcoming", label: "tomorrow", days: diffDays };
  return { cls: "upcoming", label: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }), days: diffDays };
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

function sortTasks(tasks, mode) {
  const arr = [...tasks];
  if (mode === "alpha") {
    arr.sort((a, b) => a.title.localeCompare(b.title));
  } else if (mode === "priority") {
    arr.sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || a.id - b.id);
  } else if (mode === "due") {
    arr.sort((a, b) => {
      if (!a.due_date && !b.due_date) return a.id - b.id;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return a.due_date.localeCompare(b.due_date);
    });
  } else if (mode === "newest") {
    arr.sort((a, b) => b.id - a.id);
  } else {
    arr.sort((a, b) => {
      const p = PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority];
      if (p !== 0) return p;
      if (!a.due_date && !b.due_date) return a.id - b.id;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return a.due_date.localeCompare(b.due_date) || a.id - b.id;
    });
  }
  return arr;
}

function categoryOptionsHtml(selected) {
  const opts = ['<option value="">no group</option>'];
  allCategories.forEach(c => {
    opts.push(`<option value="${escapeHtml(c.name)}" ${c.name === selected ? "selected" : ""}>${escapeHtml(c.name)}</option>`);
  });
  return opts.join("");
}

function buildRow(t, isDone) {
  const due = dueInfo(t.due_date);
  return `
    <div class="row data ${isDone ? 'done' : ''}" data-id="${t.id}">
      <div class="row-title-cell">
        ${!isDone ? `<span class="priority-dot ${t.priority}"></span>` : ''}
        <span class="row-title">${escapeHtml(t.title)}</span>
        ${t.recurrence ? `<span class="row-recurrence">↻</span>` : ''}
        ${!isDone
          ? `<select class="row-category-select category-select" data-id="${t.id}">${categoryOptionsHtml(t.category)}</select>`
          : (t.category ? `<span class="row-recurrence">${escapeHtml(t.category)}</span>` : '')}
      </div>
      <div class="row-priority-label">${t.priority}</div>
      <div class="due-badge ${isDone ? '' : due.cls}">${isDone ? (t.due_date || '—') : due.label}</div>
      <div class="row-actions">
        ${!isDone ? `<button class="icon-btn star-btn ${t.starred ? 'star-on' : ''}" data-id="${t.id}" data-val="${t.starred ? 0 : 1}">${iconStar(t.starred)}</button>` : ''}
        ${!isDone ? `<button class="icon-btn myday-btn ${t.my_day ? 'myday-on' : ''}" data-id="${t.id}" data-val="${t.my_day ? 0 : 1}">${iconSun()}</button>` : ''}
        ${!isDone ? `<button class="icon-btn complete-btn" data-id="${t.id}">${iconCheck()}</button>` : ''}
        <button class="icon-btn delete-btn" data-id="${t.id}">${iconTrash()}</button>
      </div>
    </div>`;
}

function headRow() {
  return `<div class="row head"><div>Task</div><div>Priority</div><div>Due</div><div></div></div>`;
}

function wireRowButtons(container) {
  container.querySelectorAll(".complete-btn").forEach(b =>
    b.addEventListener("click", () => completeTask(b.dataset.id)));
  container.querySelectorAll(".delete-btn").forEach(b =>
    b.addEventListener("click", () => deleteTask(b.dataset.id)));
  container.querySelectorAll(".star-btn").forEach(b =>
    b.addEventListener("click", () => toggleStar(b.dataset.id, b.dataset.val === "1")));
  container.querySelectorAll(".myday-btn").forEach(b =>
    b.addEventListener("click", () => toggleMyDay(b.dataset.id, b.dataset.val === "1")));
  container.querySelectorAll(".category-select").forEach(sel =>
    sel.addEventListener("change", () => setTaskCategory(sel.dataset.id, sel.value)));
}

const GROUP_DEFS = [
  { key: "overdue", label: "Overdue", test: d => d !== null && d < 0 },
  { key: "today", label: "Today", test: d => d === 0 },
  { key: "week", label: "This Week", test: d => d !== null && d >= 1 && d <= 7 },
  { key: "later", label: "Later", test: d => d !== null && d > 7 },
  { key: "nodate", label: "No Date", test: d => d === null },
];

function renderGroupedAll(tasks, sortMode) {
  const collapseState = getCollapseState();
  let html = "";
  for (const g of GROUP_DEFS) {
    const inGroup = tasks.filter(t => g.test(dueInfo(t.due_date).days));
    if (!inGroup.length) continue;
    const sorted = sortTasks(inGroup, sortMode);
    const collapsed = !!collapseState[g.key];
    html += `
      <div class="section-label ${collapsed ? 'collapsed' : ''}" data-group="${g.key}">
        <h2>${g.label}</h2>
        <span class="right">
          <span class="count">${sorted.length}</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </div>
      <div class="task-table ${collapsed ? 'collapsed' : ''}" data-group-table="${g.key}">
        ${headRow()}${sorted.map(t => buildRow(t, false)).join("")}
      </div>`;
  }
  activeGroups.innerHTML = html || `<div class="empty-state">No tasks yet — say "add &lt;task&gt;" to start</div>`;

  activeGroups.querySelectorAll(".section-label").forEach(label => {
    label.addEventListener("click", () => {
      const key = label.dataset.group;
      const table = activeGroups.querySelector(`[data-group-table="${key}"]`);
      const nowCollapsed = !label.classList.contains("collapsed");
      label.classList.toggle("collapsed", nowCollapsed);
      table.classList.toggle("collapsed", nowCollapsed);
      setGroupCollapsed(key, nowCollapsed);
    });
  });
  wireRowButtons(activeGroups);
}

function renderFlatActive(tasks, sortMode, emptyMsg) {
  const sorted = sortTasks(tasks, sortMode);
  activeGroups.innerHTML = sorted.length
    ? `<div class="task-table">${headRow()}${sorted.map(t => buildRow(t, false)).join("")}</div>`
    : `<div class="empty-state">${emptyMsg}</div>`;
  wireRowButtons(activeGroups);
}

function renderTables() {
  const filter = priorityFilter.value;
  const sortMode = sortSelect.value;

  let filtered = allTasks;
  if (filter !== "all") filtered = filtered.filter(t => t.priority === filter);
  if (activeGroupFilter) filtered = filtered.filter(t => t.category === activeGroupFilter);

  const pending = filtered.filter(t => t.status !== "done");
  const completed = filtered.filter(t => t.status === "done").sort((a, b) => b.id - a.id);

  if (currentView === "myday") {
    renderFlatActive(pending.filter(t => t.my_day), sortMode, `Nothing in My Day — ask to "add X to my day"`);
  } else if (currentView === "favorites") {
    renderFlatActive(pending.filter(t => t.starred), sortMode, `No favorites yet — tap the star on a task`);
  } else {
    renderGroupedAll(pending, sortMode);
  }

  completedCount.textContent = completed.length;
  completedTable.innerHTML = completed.length
    ? headRow() + completed.map(t => buildRow(t, true)).join("")
    : `<div class="empty-state">Nothing completed yet</div>`;
  wireRowButtons(completedTable);
}

function renderTasks(tasks) {
  allTasks = tasks;
  renderTables();
}

priorityFilter.addEventListener("change", renderTables);
sortSelect.addEventListener("change", renderTables);

async function fetchTasks() {
  const res = await fetch(`${API}/api/tasks?status=all`);
  const tasks = await res.json();
  renderTasks(tasks);
}

async function completeTask(id) {
  await fetch(`${API}/api/tasks/${id}/complete`, { method: "POST" });
  fetchTasks();
}

async function deleteTask(id) {
  await fetch(`${API}/api/tasks/${id}`, { method: "DELETE" });
  fetchTasks();
}

async function toggleStar(id, newVal) {
  await fetch(`${API}/api/tasks/${id}/star`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ starred: !!newVal }),
  });
  fetchTasks();
}

async function toggleMyDay(id, newVal) {
  await fetch(`${API}/api/tasks/${id}/my-day`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ my_day: !!newVal }),
  });
  fetchTasks();
}

async function setTaskCategory(id, category) {
  await fetch(`${API}/api/tasks/${id}/category`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category: category || null }),
  });
  fetchTasks();
}

const groupBar = document.getElementById("group-bar");

function renderGroupBar() {
  const chips = [`<button class="group-chip ${!activeGroupFilter ? 'active' : ''}" data-name="">All</button>`];
  allCategories.forEach(c => {
    chips.push(`
      <button class="group-chip ${activeGroupFilter === c.name ? 'active' : ''}" data-name="${escapeHtml(c.name)}">
        ${escapeHtml(c.name)}<span class="x-btn" data-del="${escapeHtml(c.name)}">×</span>
      </button>`);
  });
  chips.push(`<button class="group-chip add-chip" id="add-group-chip">+ Add group</button>`);
  groupBar.innerHTML = chips.join("");

  groupBar.querySelectorAll(".group-chip[data-name]").forEach(chip => {
    chip.addEventListener("click", (e) => {
      if (e.target.classList.contains("x-btn")) return; // handled separately
      activeGroupFilter = chip.dataset.name || null;
      renderGroupBar();
      renderTables();
    });
  });
  groupBar.querySelectorAll(".x-btn").forEach(x => {
    x.addEventListener("click", async (e) => {
      e.stopPropagation();
      const name = x.dataset.del;
      if (!confirm(`Delete the "${name}" group? Tasks in it will become ungrouped, not deleted.`)) return;
      await fetch(`${API}/api/categories/${encodeURIComponent(name)}`, { method: "DELETE" });
      if (activeGroupFilter === name) activeGroupFilter = null;
      await fetchCategories();
      fetchTasks();
    });
  });
  document.getElementById("add-group-chip").addEventListener("click", async () => {
    const name = prompt("New group name (e.g. Work, Private, Project A):");
    if (!name || !name.trim()) return;
    await fetch(`${API}/api/categories`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim() }),
    });
    await fetchCategories();
    renderTables();
  });
}

async function fetchCategories() {
  const res = await fetch(`${API}/api/categories`);
  allCategories = await res.json();
  renderGroupBar();
}

/* ---- chat thread ---- */
function addBubble(role, text, options) {
  chatEmpty.style.display = "none";
  const div = document.createElement("div");
  div.className = `bubble ${role}`;
  div.textContent = text;
  chatThread.appendChild(div);

  if (options && options.length) {
    const chipRow = document.createElement("div");
    chipRow.className = "option-chips";
    options.forEach(opt => {
      const chip = document.createElement("button");
      chip.className = "option-chip";
      chip.textContent = opt;
      chip.addEventListener("click", () => {
        chipRow.remove(); // one shot - avoid stale buttons after the reply moves on
        sendCommand(opt);
      });
      chipRow.appendChild(chip);
    });
    chatThread.appendChild(chipRow);
  }

  chatThread.scrollTop = chatThread.scrollHeight;
}

async function loadChatHistory() {
  try {
    const res = await fetch(`${API}/api/chat/history`);
    const messages = await res.json();
    if (messages.length) chatEmpty.style.display = "none";
    messages.forEach(m => addBubble(m.role, m.content));
  } catch (e) { /* non-fatal */ }
}

clearChatBtn.addEventListener("click", async () => {
  await fetch(`${API}/api/chat/clear`, { method: "POST" });
  chatThread.querySelectorAll(".bubble").forEach(b => b.remove());
  chatEmpty.style.display = "block";
});

async function sendCommand(text) {
  addBubble("user", text);
  setStatus(`Thinking about "${text}"…`, true);
  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    addBubble("assistant", data.message, data.options);
    setStatus("Tap the mic, ask or say a command");
    speak(data.message);
    renderTasks(data.tasks || []);
  } catch (e) {
    setStatus("Couldn't reach the server. Check your connection.");
  }
}

typeSend.addEventListener("click", () => {
  const text = typeInput.value.trim();
  if (text) { sendCommand(text); typeInput.value = ""; }
});
typeInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") typeSend.click();
});

/* ---- voice ---- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;

if (SpeechRecognition) {
  recognizer = new SpeechRecognition();
  recognizer.lang = "en-US";
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;

  recognizer.onstart = () => {
    listening = true;
    micBtn.classList.add("listening");
    micRing.classList.add("listening");
    setStatus("Listening…", true);
  };

  recognizer.onresult = (event) => {
    const text = event.results[0][0].transcript;
    sendCommand(text);
  };

  recognizer.onerror = (e) => {
    setStatus(e.error === "not-allowed" ? "Mic access denied — check browser settings" : "Didn't catch that, try again");
  };

  recognizer.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    micRing.classList.remove("listening");
  };
} else {
  setStatus("Voice input isn't supported in this browser — type below");
  micBtn.disabled = true;
  micBtn.style.opacity = "0.4";
}

micBtn.addEventListener("click", () => {
  if (!recognizer) return;
  if (listening) {
    recognizer.stop();
  } else {
    recognizer.start();
  }
});

/* ---- excel ---- */
exportBtn.addEventListener("click", () => {
  window.location.href = `${API}/api/export`;
});

importBtn.addEventListener("click", () => importInput.click());

importInput.addEventListener("change", async () => {
  const file = importInput.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  setStatus("Importing…", true);
  try {
    const res = await fetch(`${API}/api/import`, { method: "POST", body: formData });
    const data = await res.json();
    if (res.ok) {
      setStatus(`Imported ${data.imported} tasks (${data.skipped} skipped as duplicates)`);
      renderTasks(data.tasks || []);
    } else {
      setStatus(data.detail || "Import failed");
    }
  } catch (e) {
    setStatus("Import failed — check your connection");
  }
  importInput.value = "";
});

(async function init() {
  await fetchCategories();
  await fetchTasks();
  loadChatHistory();
})();
</script>
